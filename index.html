  <body class="notranslate">
    <div class="app-shell">
      <aside class="sidebar" aria-label="メニュー">
        <div class="brand">
          <span class="brand-mark">酒</span>
          <div>
            <p class="brand-kicker">Personal Sake Archive</p>
            <p class="brand-title">Sake Cellar</p>
          </div>
        </div>

        <nav class="main-nav" aria-label="主要ナビゲーション">
          <a class="nav-item is-active" href="#">コレクション</a>
          <a class="nav-item" href="#">テイスティング</a>
          <a class="nav-item" href="#">蔵元マップ</a>
          <a class="nav-item" href="#">ランキング</a>
        </nav>

        <section class="side-panel">
          <p class="panel-label">飲酒ログ</p>
          <div class="progress-ring" aria-label="登録済み本数">
            <span id="totalBottles">0</span>
            <small>bottles</small>
          </div>
          <dl class="mini-stats">
            <div>
              <dt>県</dt>
              <dd id="prefectureCount">0</dd>
            </div>
            <div>
              <dt>酒造名</dt>
              <dd id="breweryCount">0</dd>
            </div>
            <div>
              <dt>平均評価</dt>
              <dd id="averageRating">0.0</dd>
            </div>
          </dl>
        </section>
      </aside>

      <main class="workspace">
        <header class="hero">
          <div class="hero-copy">
            <p class="eyebrow">My tasting journal</p>
            <h1><span>日本酒の記憶を、</span><span>美しくたどる。</span></h1>
            <p>
              銘柄、蔵元、土地、飲んだ日の記憶を、写真とコメントで振り返る個人アーカイブ。
            </p>
          </div>

          <form class="quick-add" aria-label="新規登録フォーム">
            <div class="photo-uploader">
              <input id="bottle-photo" type="file" accept="image/*" />
              <label for="bottle-photo">
                <span class="camera-icon">＋</span>
                <strong>画像を添付</strong>
                <small>将来の追加フォーム用モック</small>
              </label>
            </div>

            <div class="form-grid">
              <label>
                銘柄
                <input type="text" value="楽器正宗 中取り" />
              </label>
              <label>
                読み方
                <input type="text" value="がっきまさむね なかどり" />
              </label>
              <label>
                評価
                <select>
                  <option>★★★★★★</option>
                  <option selected>★★★★★☆</option>
                  <option>★★★★☆☆</option>
                  <option>★★★☆☆☆</option>
                  <option>★★☆☆☆☆</option>
                  <option>★☆☆☆☆☆</option>
                </select>
              </label>
              <label>
                特定名称
                <select>
                  <option>純米大吟醸</option>
                  <option selected>純米吟醸</option>
                  <option>純米</option>
                  <option>本醸造</option>
                  <option>普通酒</option>
                </select>
              </label>
              <label>
                県名
                <input type="text" value="福島県" />
              </label>
              <label>
                酒造名
                <input type="text" value="大木代吉本店" />
              </label>
              <label>
                飲んだ日
                <input type="date" value="2026-05-10" />
              </label>
            </div>

            <label class="comment-field">
              コメント
              <textarea rows="3">フレッシュで軽快。食中でも単体でも飲みやすく、香りの余韻がきれい。</textarea>
            </label>

            <button type="button">この内容で追加</button>
          </form>
        </header>

        <section class="toolbar" aria-label="検索と絞り込み">
          <label class="search-box">
            <span>Search</span>
            <input id="sakeSearch" type="search" placeholder="銘柄、県名、酒造名、コメントで検索" />
          </label>

          <div class="filter-group" aria-label="絞り込み条件">
            <button class="chip is-selected" type="button" data-filter="all">すべて</button>
            <button class="chip" type="button" data-filter="high-rating">★★★★★☆以上</button>
            <button class="chip" type="button" data-filter="junmai-ginjo">純米吟醸</button>
            <button class="chip" type="button" data-filter="tohoku">東北</button>
            <button class="chip" type="button" data-filter="has-comment">コメントあり</button>
          </div>
        </section>

        <section class="section-heading">
          <div>
            <p class="eyebrow">Collection</p>
            <h2>日本酒コレクション</h2>
          </div>
          <div class="heading-actions">
            <button class="view-toggle" type="button" id="visibleCount">0本表示</button>
            <div class="visitor-badge" id="visitorBadge" aria-label="サイト訪問者数">
              <span>訪問者数</span>
              <strong id="visitorCount">--</strong>
              <small id="visitorStatus">計測設定待ち</small>
            </div>
          </div>
        </section>

        <section class="sake-grid" id="sakeGrid" aria-label="日本酒一覧"></section>
        <noscript>
          <section class="seo-fallback" aria-label="登録されている日本酒">
            <h2>登録されている日本酒</h2>
            <ul>
              <li>作 - 三重県 / 清水酒造</li>
              <li>磯自慢 - 静岡県 / 磯自慢酒造</li>
              <li>鳳凰美田 - 栃木県 / 小林酒造</li>
              <li>初亀 - 静岡県 / 初亀酒造</li>
              <li>松の寿 - 栃木県 / 松井酒造</li>
              <li>南 - 高知県 / 南酒造場（みなみしゅぞう）</li>
              <li>姿 - 栃木県 / 飯沼銘醸</li>
              <li>義侠 - 愛知県 / 山忠本家酒造</li>
              <li>かんだ光壽【日本酒専門店】 - 不明 / 不明</li>
              <li>澤の花　ひまり - 長野県 / 伴野酒造</li>
              <li>満寿泉 - 富山県 / 桝田酒造店</li>
              <li>澤乃井・亀口酒 - 東京都 / 澤乃井酒造</li>
              <li>写楽 - 福島県 / 宮泉銘醸</li>
              <li>ちえびじん - 大分県 / 中野酒造</li>
              <li>あらま - 岩手県 / 喜久盛酒造</li>
              <li>凛峰 - 神奈川県 / 川西屋酒造店</li>
              <li>竹泉 - 兵庫県 / 田治米合名会社</li>
              <li>游 - 福井県 / 吉田酒造</li>
              <li>雪男 - 新潟県 / 青木酒</li>
              <li>春鹿 - 奈良県 / 今西清兵衛商店</li>
              <li>中乗さん - 長野県 / 中善酒造</li>
            </ul>
          </section>
        </noscript>

        <section class="table-section" aria-label="一覧テーブル">
          <div class="section-heading compact">
            <div>
              <p class="eyebrow">Database</p>
              <h2>日本酒アーカイブ一覧</h2>
            </div>
          </div>
          <div class="data-table" role="table" aria-label="日本酒データ一覧">
            <div class="table-row table-head" role="row">
              <span role="columnheader">銘柄</span>
              <span role="columnheader">読み方</span>
              <span role="columnheader">評価</span>
              <span role="columnheader">特定名称</span>
              <span role="columnheader">県名</span>
              <span role="columnheader">酒造名</span>
              <span role="columnheader">飲んだ日</span>
              <span role="columnheader">コメント</span>
            </div>
            <div class="table-body" id="sakeTableBody"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="sake-app.js?v=20260817-seo-v1"></script>
  </body>
